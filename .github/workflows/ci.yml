# The same `make ci` that runs locally, on a Linux runner: the Dart domain,
# the Flutter widget tests and the .NET server all run without a device.
# Local and CI cannot disagree about what "passing" means because they run
# one target. What CI adds is that nobody has to remember to run it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pillow, for the brand mark check
        run: python3 -m pip install --quiet Pillow

      - name: make ci
        run: make ci FLUTTER=flutter DART=dart DOTNET=dotnet

  # The app built for Android on the runner, which has a JDK this Mac does
  # not. iOS is built on the Mac; both are Phase 0's "both platforms".
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Build the debug APK
        run: cd app && flutter pub get && flutter build apk --debug
