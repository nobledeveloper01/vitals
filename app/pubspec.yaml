name: vitals
description: Portable primary health records and drug authenticity verification for Nigeria.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  vitals_domain:
    path: ../packages/vitals_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mark/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
