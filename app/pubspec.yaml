name: vitals
description: Portable primary health records and drug authenticity verification for Nigeria.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  bluetooth_low_energy: ^6.2.1
  cryptography: ^2.9.0
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.1
  geolocator: ^14.0.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.0
  qr: ^3.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  vitals_domain:
    path: ../packages/vitals_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mark/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
